<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Application SaaS — tableau de bord et modules métier." />
    <title>SaaS App</title>

    <!-- Sans icône déclarée, le navigateur réclame /favicon.ico : 404 en
         développement, et en déploiement le repli SPA lui renvoie index.html,
         donc du HTML là où une image est attendue. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#243dec" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Applique le thème AVANT le premier rendu : sans cela, un utilisateur
      // en mode sombre verrait un flash blanc au chargement de la page.
      ;(function () {
        try {
          const stored = localStorage.getItem('theme') || 'system'
          const dark =
            stored === 'dark' ||
            (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          /* localStorage indisponible (navigation privée) : thème clair par défaut */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
