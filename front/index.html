<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Application SaaS — tableau de bord et modules métier." />
    <title>SaaS App</title>

    <!-- Sans icône déclarée, le navigateur réclame /favicon.ico : 404 en
         développement, et en déploiement le repli SPA lui renvoie index.html,
         donc du HTML là où une image est attendue. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0b0d11" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Archivo est demandé avec ses DEUX axes : la graisse et la CHASSE.
         La chasse sert aux libellés en capitales, qui se condensent au lieu
         de s'allonger — ce que fait toute signalétique quand le mot est plus
         long que la place disponible. Sans « wdth » dans l'adresse, Google
         sert la version à chasse fixe et « font-stretch » n'a aucun effet.

         Deux familles, comme avant : Geist Mono demeure pour ce qui s'aligne
         en colonne, empreintes de commit et compteurs. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Geist+Mono:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <script>
      // Applique le thème AVANT le premier rendu : sans cela, la page
      // apparaîtrait une fraction de seconde dans le mauvais thème.
      //
      // Le sombre étant la référence de cette direction visuelle, c'est la
      // classe « light » qui bascule — l'inverse de l'usage courant.
      ;(function () {
        try {
          const stored = localStorage.getItem('theme') || 'system'
          const light =
            stored === 'light' ||
            (stored === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches)
          document.documentElement.classList.toggle('light', light)
        } catch (e) {
          /* stockage indisponible : le thème sombre par défaut s'applique */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
