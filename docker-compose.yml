# ============================================================================
#  SaaS Starter — Orchestration Docker
#  Services : PostgreSQL  <-  PHP-FPM  <-  Nginx   (API REST)
#             Node/Vite                            (Client Vue 3)
#  Lancement : docker compose up -d --build
# ============================================================================

services:

  # --------------------------------------------------------------------------
  # Base de données PostgreSQL
  # Les scripts de ./back/database/init sont joués UNE SEULE FOIS,
  # à la création du volume db_data (cf. Étape 2).
  # --------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: saas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saas_db}
      POSTGRES_USER: ${POSTGRES_USER:-saas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saas_password}
      # Encodage/collation cohérents pour éviter les surprises sur les tris
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      # Lu par le garde-fou de seeds/dev.sql : en production, le jeu de
      # données de démonstration refuse de s'exécuter.
      APP_ENV: ${APP_ENV:-development}
      # Jeu de données chargé par init/03_seed.sh à la création du volume.
      DB_SEED: ${DB_SEED:-dev.sql}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./back/database/init:/docker-entrypoint-initdb.d:ro
      # Les jeux de données ne sont PAS dans init/ : rien n'est chargé du seul
      # fait de leur présence. init/03_seed.sh sélectionne le bon via DB_SEED.
      - ./back/database/seeds:/seeds:ro
    ports:
      # Exposé pour brancher un client SQL depuis Windows (DBeaver, TablePlus...)
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saas_user} -d ${POSTGRES_DB:-saas_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - saas_net

  # --------------------------------------------------------------------------
  # PHP-FPM 8.3 — exécute le code de l'API (aucun port exposé : passe par Nginx)
  # --------------------------------------------------------------------------
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: saas_php
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      # --- Connexion PDO (nom du service Docker comme hôte) ---
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-saas_db}
      DB_USER: ${POSTGRES_USER:-saas_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-saas_password}
      # --- Sécurité / JWT (cf. Étape 3) ---
      JWT_SECRET: ${JWT_SECRET:-change_me_in_env_file}
      JWT_ISSUER: ${JWT_ISSUER:-saas-api}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-1209600}
      # --- CORS : origine autorisée = serveur de dev Vite ---
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      # --- Liens envoyés par e-mail (vérification, réinitialisation) ---
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      # --- SMTP (Mailpit en développement) ---
      MAIL_HOST: ${MAIL_HOST:-mailer}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-none}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@saas.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SaaS App}
    volumes:
      - ./back:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - saas_net

  # --------------------------------------------------------------------------
  # Nginx — reverse proxy / serveur web de l'API (document root = back/public)
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: saas_nginx
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:80"
    volumes:
      - ./back:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - saas_net

  # --------------------------------------------------------------------------
  # Node 20 / Vite — serveur de développement du client Vue 3 (HMR)
  # node_modules est isolé dans un volume nommé : évite les conflits
  # entre les binaires Windows (hôte) et Linux (conteneur).
  # --------------------------------------------------------------------------
  node:
    build:
      context: ./docker/node
      dockerfile: Dockerfile
    container_name: saas_node
    restart: unless-stopped
    working_dir: /app
    environment:
      # L'URL est injectée dans le build Vite (import.meta.env.VITE_API_BASE_URL)
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
      # Bind mounts Windows : le watch natif ne remonte pas, on force le polling
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules
    ports:
      - "${FRONT_PORT:-5173}:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - saas_net

  # --------------------------------------------------------------------------
  # Mailpit — serveur SMTP de développement.
  # Il intercepte TOUS les e-mails sortants : rien ne part vers de vraies
  # boîtes pendant les tests. Interface web pour les consulter.
  # --------------------------------------------------------------------------
  mailer:
    image: axllent/mailpit:latest
    container_name: saas_mailer
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_PORT:-8025}:8025"   # interface web
    networks:
      - saas_net

  # --------------------------------------------------------------------------
  # Adminer — client SQL web (optionnel).
  # Démarrage explicite : docker compose --profile tools up -d
  # --------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: saas_adminer
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - db
    networks:
      - saas_net

volumes:
  db_data:
    name: saas_db_data
  front_node_modules:
    name: saas_front_node_modules

networks:
  saas_net:
    name: saas_net
    driver: bridge
