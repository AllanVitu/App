name: CI

# Sans exécution automatique, une suite de tests devient un décor : elle
# pourrit sans que personne ne s'en aperçoive. Tout ce que la CI exécute ici
# est aussi exécutable en local (`composer check`, `npm run check`).
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  # Une nouvelle poussée annule la vérification de la précédente : inutile de
  # payer pour un état déjà dépassé.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # API : formatage, analyse statique, tests unitaires et d'intégration
  # ---------------------------------------------------------------------------
  api:
    name: API PHP
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: saas_db
          POSTGRES_USER: saas_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saas_user -d saas_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: saas_db
      DB_USER: saas_user
      DB_PASSWORD: ci_password

    defaults:
      run:
        working-directory: back

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, intl, mbstring
          coverage: none
          tools: composer:v2

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: back/vendor
          key: composer-${{ hashFiles('back/composer.lock') }}
          restore-keys: composer-

      - name: Installer les dépendances
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Formatage (PSR-12)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
        env:
          PHP_CS_FIXER_IGNORE_ENV: 1

      - name: Analyse statique
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - name: Tests
        run: vendor/bin/phpunit

  # ---------------------------------------------------------------------------
  # Client : lint, formatage, tests unitaires, build
  # ---------------------------------------------------------------------------
  front:
    name: Client Vue
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatage
        run: npm run format:check

      - name: Tests unitaires
        run: npm run test

      - name: Build
        run: npm run build

      # Le découpage en lots protège l'écran de connexion : sans lui, il
      # télécharge la mesure de mise en page et le morphing SVG dont il ne se
      # sert pas. Il se casse EN SILENCE — une règle qui disparaît de
      # « manualChunks » ne rougit aucun test. Ce contrôle ne peut pas vivre
      # dans la suite Playwright, qui tourne contre le serveur de
      # développement, où Vite sert les modules un par un, sans lot : il lui
      # faut donc la compilation ci-dessus, et sa place est ici.
      - name: Découpage des lots
        run: npm run check:chunks

  # ---------------------------------------------------------------------------
  # Parcours de bout en bout, contre la stack Docker réelle
  # ---------------------------------------------------------------------------
  e2e:
    name: Parcours navigateur
    runs-on: ubuntu-latest
    needs: [api, front]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Préparer l'environnement
        run: cp .env.example .env

      - name: Démarrer la stack
        run: docker compose up -d --build

      - name: Attendre l'API et le client
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/health > /dev/null \
               && curl -sf http://localhost:5173/ > /dev/null; then
              echo "stack prête"; exit 0
            fi
            sleep 5
          done
          echo "la stack n'a pas démarré à temps"
          docker compose logs --tail 50
          exit 1

      - name: Installer Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Exécuter les parcours
        working-directory: e2e
        run: npx playwright test

      - name: Journaux de la stack en cas d'échec
        if: failure()
        run: docker compose logs --tail 120

      - name: Conserver le rapport
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: e2e/playwright-report
          retention-days: 7
