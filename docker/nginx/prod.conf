# ============================================================================
#  Nginx — vhost de DÉPLOIEMENT
#
#  Une seule origine sert :
#    /api/*  -> PHP-FPM (conteneur « php »)
#    le reste -> le client Vue compilé, avec repli SPA sur index.html
# ============================================================================

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 20M;
    server_tokens off;

    # --- Compression ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- En-têtes de sécurité ------------------------------------------------
    include /etc/nginx/security-headers.conf;

    # --- API -----------------------------------------------------------------
    # Aucun fichier PHP n'existe côté Nginx : la requête est directement
    # relayée au conteneur « php », qui embarque le code.
    location /api/ {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        internal;

        fastcgi_pass   php:9000;
        include        fastcgi_params;

        # Chemin du contrôleur frontal TEL QU'IL EXISTE DANS LE CONTENEUR PHP.
        fastcgi_param  SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param  SCRIPT_NAME     /index.php;
        fastcgi_param  DOCUMENT_ROOT   /var/www/html/public;

        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # --- Ressources compilées ------------------------------------------------
    # Les noms de fichiers produits par Vite contiennent une empreinte :
    # ils peuvent être mis en cache indéfiniment.
    location /assets/ {
        # Ce bloc déclare un add_header : sans la ré-inclusion, il annulerait
        # tous les en-têtes de sécurité hérités du bloc server.
        include /etc/nginx/security-headers.conf;

        # Une seule directive de cache : « expires » ajoute son propre
        # Cache-Control, ce qui produirait deux en-têtes contradictoires.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --- Client Vue (history mode) -------------------------------------------
    # index.html ne doit JAMAIS être mis en cache, sinon un déploiement
    # continue de servir les anciennes références de bundles.
    location / {
        try_files $uri $uri/ /index.html;
        # Idem : l'add_header ci-dessous masquerait les en-têtes de sécurité.
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
