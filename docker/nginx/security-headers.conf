# ============================================================================
#  En-têtes de sécurité communs
#
#  ⚠ Ce fichier doit être inclus dans CHAQUE bloc location qui déclare son
#    propre add_header. Nginx n'hérite pas les add_header d'un niveau
#    supérieur dès qu'un niveau inférieur en définit un seul : les en-têtes
#    du bloc « server » disparaissent alors silencieusement.
#    C'est la raison d'être de ce fichier plutôt que d'une déclaration unique.
# ============================================================================

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options        "DENY"    always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

# ┌──────────────────────────────────────────────────────────────────────────┐
# │  RIEN QUI NE VIENNE DE L'APPLICATION                                     │
# │                                                                          │
# │  Plus de « 'unsafe-inline' » : un script ou un style glissé dans la page  │
# │  par une injection n'est plus exécuté. Le thème, seul script qui était    │
# │  écrit dans index.html, est devenu un fichier (public/theme-boot.js).     │
# │                                                                          │
# │  Plus de Google Fonts : les polices sont servies par l'application, et   │
# │  l'adresse IP des visiteurs ne part plus chez un tiers sans              │
# │  consentement. Plus de « img-src https: » : les images téléversées sont  │
# │  servies par l'API, sur la même origine.                                 │
# │                                                                          │
# │  Les styles posés par JavaScript (Vue, anime.js) passent par le CSSOM,   │
# │  que « style-src » ne régit pas. front/scripts/check-csp.mjs vérifie la  │
# │  compilation, e2e/tests/csp.spec.js un vrai navigateur sous cette        │
# │  politique.                                                              │
# └──────────────────────────────────────────────────────────────────────────┘
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# Aucune de ces capacités ne sert : les refuser d'office empêche qu'un script
# — ou une dépendance — les réclame un jour au nom de l'application.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Ignoré par le navigateur tant que la page arrive en HTTP : il ne prend effet
# que derrière la terminaison TLS, qui peut aussi le poser. Sans
# « includeSubDomains » : ce fichier ne sait rien des autres sous-domaines.
add_header Strict-Transport-Security "max-age=31536000" always;
