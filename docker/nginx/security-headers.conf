# ============================================================================
#  En-têtes de sécurité communs
#
#  ⚠ Ce fichier doit être inclus dans CHAQUE bloc location qui déclare son
#    propre add_header. Nginx n'hérite pas les add_header d'un niveau
#    supérieur dès qu'un niveau inférieur en définit un seul : les en-têtes
#    du bloc « server » disparaissent alors silencieusement.
#    C'est la raison d'être de ce fichier plutôt que d'une déclaration unique.
# ============================================================================

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options        "DENY"    always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

# Le client ne charge que ses propres ressources ; seules les polices Google
# sont autorisées (cf. front/index.html). À adapter si d'autres services
# externes sont introduits.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
