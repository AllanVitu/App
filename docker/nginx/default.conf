# ============================================================================
#  Nginx — vhost de l'API PHP
#  Le document root pointe sur back/public : seul ce dossier est exposé,
#  le code source (back/src) reste inaccessible depuis l'extérieur.
# ============================================================================

server {
    listen 80;
    server_name localhost;

    root  /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # --- Durcissement : on ne divulgue pas la version de Nginx ---
    server_tokens off;

    # --- En-têtes de sécurité de base ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "no-referrer" always;

    # --- Front controller : toute requête est routée vers public/index.php ---
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # --- Exécution PHP déléguée à PHP-FPM (service "php", port 9000) ---
    #
    # LE NOM « php » EST RÉSOLU À CHAQUE REQUÊTE, pas au démarrage de Nginx.
    #
    # Écrit en dur (« fastcgi_pass php:9000; »), il était résolu UNE fois, au
    # chargement de la configuration. Recréer le conteneur PHP — une nouvelle
    # image, un volume ajouté — lui donne une autre adresse ; Nginx continuait
    # d'appeler l'ancienne et répondait 502 à toute l'API jusqu'à son propre
    # redémarrage. Constaté le 14 septembre 2026 : une suite de parcours
    # entière a échoué sur « Impossible de joindre l'API » pour cette seule
    # raison.
    #
    # Une variable force la résolution au moment de la requête, par le DNS que
    # Docker sert dans chaque réseau (127.0.0.11), et « valid=10s » borne le
    # temps pendant lequel une adresse périmée peut encore servir.
    location ~ ^/index\.php(/|$) {
        resolver       127.0.0.11 valid=10s ipv6=off;
        set            $php_upstream php:9000;
        fastcgi_pass   $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;

        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO       $fastcgi_path_info;
        fastcgi_param  DOCUMENT_ROOT   $document_root;

        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        internal;
    }

    # --- Aucun autre .php ne doit être appelable directement ---
    location ~ \.php$ {
        return 404;
    }

    # --- Fichiers cachés (.env, .git...) : accès refusé ---
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/api.access.log;
    error_log  /var/log/nginx/api.error.log warn;
}
