# ============================================================================
#  Nginx — vhost de l'API PHP
#  Le document root pointe sur back/public : seul ce dossier est exposé,
#  le code source (back/src) reste inaccessible depuis l'extérieur.
# ============================================================================

server {
    listen 80;
    server_name localhost;

    root  /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # --- Durcissement : on ne divulgue pas la version de Nginx ---
    server_tokens off;

    # --- En-têtes de sécurité de base ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "no-referrer" always;

    # --- Front controller : toute requête est routée vers public/index.php ---
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # --- Exécution PHP déléguée à PHP-FPM (service "php", port 9000) ---
    location ~ ^/index\.php(/|$) {
        fastcgi_pass   php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;

        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO       $fastcgi_path_info;
        fastcgi_param  DOCUMENT_ROOT   $document_root;

        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        internal;
    }

    # --- Aucun autre .php ne doit être appelable directement ---
    location ~ \.php$ {
        return 404;
    }

    # --- Fichiers cachés (.env, .git...) : accès refusé ---
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/api.access.log;
    error_log  /var/log/nginx/api.error.log warn;
}
