; ===========================================================================
;  Configuration PHP de DÉPLOIEMENT
;
;  Deux objectifs : ne rien divulguer, et ne rien relire inutilement.
; ===========================================================================

[PHP]
expose_php = Off
memory_limit = 256M
max_execution_time = 30
post_max_size = 20M
upload_max_filesize = 20M
date.timezone = UTC

; --- Erreurs : jamais affichées au client, toujours journalisées ------------
; Une trace PHP renvoyée dans une réponse divulgue chemins, versions et
; parfois des requêtes SQL complètes.
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL
log_errors = On
error_log = /proc/self/fd/2

[Session]
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Strict"
session.use_strict_mode = 1
session.gc_maxlifetime = 3600

[opcache]
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16
; Le code est figé dans l'image : inutile de vérifier les dates de
; modification à chaque requête.
opcache.validate_timestamps = 0
