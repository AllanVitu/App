; ===========================================================================
;  Configuration PHP applicative (dev)
;  Note : en production, passer display_errors=Off et opcache.validate_timestamps=0
; ===========================================================================

[PHP]
expose_php = Off
memory_limit = 256M
max_execution_time = 30
post_max_size = 20M
upload_max_filesize = 20M
date.timezone = Europe/Paris

; --- Erreurs : visibles en développement ---
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /proc/self/fd/2

[Session]
; Sessions durcies (utile si l'on complète le JWT par un cookie de refresh)
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
session.gc_maxlifetime = 3600

[opcache]
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
; En dev on recharge le code modifié à chaud
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
